limit: 200
mem_size: 0x90
io_mem_map:
  output:
    port: 0x84
log_fmt:
#  debug:     # (turns on a debugger)
  only_start:
    data:
      mem:
        slice:
          - [ 0, 16 ]
          - [ 17, 32 ]
      decompiled:
        slice:
          - [ 0, 40 ]
    view: "mem-|-decompiled"
  each_tick:
    data:
      regs:
        slice: "all"
      pl_stage_mnemonics:
      tick:
      is_interruption:
    view: "tick- -is_interruption-regs-pl_stage_mnemonics"
  assertion:
    - name: "mem"
      byte:
      slice: [ 0, 4 ]
      expected: [ 0, 0, 0, 0 ]
    - name: "regs"
      byte:
      slice: [ 0, 1, 2, 3 ]
      expected: [ 1, 0, 0, 0 ]