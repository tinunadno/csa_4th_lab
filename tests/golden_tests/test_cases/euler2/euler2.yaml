####################################################
#                 Описание алгоритма               #
#   на вход подается число, нужно вычислить        #
#   разницу суммы квадратов и квадрата суммы       #
#   всех натуральных чисел до входного             #
#           (конкретное число - 100)               #
####################################################
#                 решение на питоне:               #
#          print(sum(list(range(1, 101)))**2       #
#       - sum([i*i for i in range(1, 101)]))       #
####################################################
limit: 2000
mem_size: 0x90
io_mem_map:
  int_vector: 0x16
  input:
    port: 0x80
    interruptions: [ [ 16, 100 ] ]
  output:
    port: 0x84
log_fmt:
  assertion:
    - name: "output"
      expected: [ 25164150 ]