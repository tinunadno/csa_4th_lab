limit: 200
mem_size: 0x90
io_mem_map:
  int_vector: 0x16
  input:
    port: 0x80
    interruptions: [ [ 16, 'a' ] ]
  output:
    port: 0x80
log_fmt:
  only_start:
    data:
      mem:
        slice:
          - [ 0, 16 ]
      decompiled:
        slice:
          - [ 0, 40 ]
    view: "mem-|-decompiled"
  each_tick:
    data:
      regs:
        slice: "all"
      pl_stage_mnemonics:
      tick:
      is_interruption:
    view: "tick- -is_interruption-regs-pl_stage_mnemonics"
  assertion:
    - name: "mem"
      slice: [ 0, 4 ]
      expected: [ 0x61, 0x00, 0x00, 0x00 ]
    - name: "regs"
      slice: [ 0x0, 0x1 ]
      expected: [ 0x61, 1 ]
    - name: "output"
      expected: []

